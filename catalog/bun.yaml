schemaVersion: "1.0.0"
id: "bun"
name: "Bun"
description: "JavaScript runtime, package manager, test runner, and bundler"
homepage: "https://bun.sh"
tags:
  - runtime
  - javascript
  - package-manager

versionSource:
  type: githubReleases
  repo: oven-sh/bun
  tagPrefix: "bun-v"

assets:
  - platform: win
    arch: x64
    url: "https://github.com/oven-sh/bun/releases/download/bun-v{version}/bun-windows-x64.zip"
    type: zip

install:
  type: archive
  requiresAdmin: false
  targetDir: "{managed}/bun/{version}"
  postInstall:
    - type: addToPath
      value: "{targetDir}/bun-windows-x64"

validate:
  command: "\"{targetDir}\\bun-windows-x64\\bun.exe\" --version"
  parse: regex
  pattern: "([\\d]+\\.[\\d]+\\.[\\d]+)"
